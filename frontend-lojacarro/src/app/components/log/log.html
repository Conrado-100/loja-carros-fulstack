<h2>Histórico de Logs do Sistema</h2>

<button (click)="carregarLogs()" style="margin-bottom: 15px; padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
  Atualizar Logs
</button>

<table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse; text-align: left;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th>ID</th>
      <th>Ação</th>
      <th>Data / Hora</th>
      <th>Detalhes</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let log of logs">
      <td>{{ log.id }}</td>
      <td>{{ log.acao }}</td>
      <td>{{ log.dataHora | date:'dd/MM/yyyy HH:mm:ss' }}</td>
      <td>{{ log.detalhes }}</td>
    </tr>
    <tr *ngIf="logs.length === 0">
      <td colspan="4" style="text-align: center;">Nenhum log registrado.</td>
    </tr>
  </tbody>
</table>
