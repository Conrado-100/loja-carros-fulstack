# Configurações de Identificação do Projeto
spring.application.name=lojaCarro
spring.profiles.active=${SERVER:dev}

# Configuração do MySQL (XAMPP) apontando para lojacarro01
spring.datasource.url=jdbc:mysql://localhost:3306/lojacarro01?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect